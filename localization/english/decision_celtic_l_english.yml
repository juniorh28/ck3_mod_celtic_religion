l_english:

# Reclaiming  Albion, by Linnéa Thimrén
 celtic_albion.0001.t:0 "[reclaimer.GetCulture.GetNameNoTooltip|U] Albion"
 celtic_albion.0001.desc:0 "For too long this great island of ours has been under foreign rule — at last it is back in Celtic hands! I look out over the fields, and it is as if the sun shines for the first time in years; it is as if the land of abundance and health, Tír na nÓg, has returned to greet us welcome. The hills and valleys of our ancestors are once again embraced by [ROOT.Char.GetCulture] culture."
 celtic_albion.0001.custom:0 "All [counties|E] in Albion"
 celtic_albion.0001.a:0 "Praised be the ancestors!"

 celtic_albion.0002.desc:0 "The [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('reclaimer'))] [reclaimer.GetName] has officially announced the rebirth of a Celtic rule. \n\nAfter centuries of foreign rule, the Isles have returned under the control of their original owners."
 celtic_albion.0002.a:0 "A [reclaimer.GetCulture.GetNameNoTooltip] scourge upon the lands..."
 celtic_albion.0002.b:0 "Albion is ours once again!"